<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Soft Latte Art Background Gradients -->
    <radialGradient id="latteBase" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FDF3E3"/>
      <stop offset="55%" stop-color="#F7E2C3"/>
      <stop offset="100%" stop-color="#ECD0A5"/>
    </radialGradient>
    <linearGradient id="latteCrema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C594" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#DFB980" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EED1A2" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Circular Latte Background -->
  <circle cx="160" cy="160" r="150" fill="url(#latteBase)" />

  <!-- Soft Latte Art Swirls -->
  <path d="M70 120 C100 80, 140 60, 200 70 C240 78, 270 120, 250 170 C230 220, 170 260, 110 240 C60 220, 40 160, 70 120 Z" fill="url(#latteCrema)" opacity="0.45"/>
  <path d="M120 140 C140 100, 180 90, 210 110 C240 130, 240 180, 210 210 C180 240, 130 230, 110 190 C95 160, 105 150, 120 140 Z" fill="#FDF5E8" opacity="0.5"/>

  <!-- Coffee Brown Color: #3E2213 -->
  <g fill="none" stroke="#3E2213" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Angel Halo -->
    <ellipse cx="160" cy="74" rx="20" ry="7.5" stroke-width="5" fill="#F8E5C8"/>

    <!-- Left Angel Wing Outer & Inner Feathers -->
    <path d="M160 110 C146 92, 116 80, 78 82 C82 96, 92 106, 112 110 C86 110, 74 118, 80 128 C98 136, 132 126, 160 110 Z" fill="#F8E5C8" stroke-width="5"/>
    <path d="M112 110 C96 104, 88 94, 80 84" stroke-width="4"/>
    <path d="M124 122 C108 122, 94 125, 84 130" stroke-width="4"/>

    <!-- Right Angel Wing Outer & Inner Feathers -->
    <path d="M160 110 C174 92, 204 80, 242 82 C238 96, 228 106, 208 110 C234 110, 246 118, 240 128 C222 136, 188 126, 160 110 Z" fill="#F8E5C8" stroke-width="5"/>
    <path d="M208 110 C224 104, 232 94, 240 84" stroke-width="4"/>
    <path d="M196 122 C212 122, 226 125, 236 130" stroke-width="4"/>

    <!-- Bottom Center Heart Notch -->
    <path d="M152 114 L160 124 L168 114" stroke-width="4.5" fill="#F8E5C8"/>
  </g>

  <!-- 11:11 Typography -->
  <g fill="#3E2213">
    <!-- First '11' -->
    <!-- 1 -->
    <path d="M96 150 L108 145 L108 188 L116 188 L116 193 L96 193 L96 188 L104 188 L104 152 L96 156 Z"/>
    <!-- 1 -->
    <path d="M122 150 L134 145 L134 188 L142 188 L142 193 L122 193 L122 188 L130 188 L130 152 L122 156 Z"/>

    <!-- Coffee Bean Colon Dots -->
    <!-- Top Bean -->
    <g transform="translate(160, 159) rotate(18)">
      <ellipse cx="0" cy="0" rx="3.8" ry="5.5"/>
      <path d="M-0.2 -5 C0.8 -2, -0.8 2, 0.2 5" stroke="#F8E5C8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Bottom Bean -->
    <g transform="translate(160, 178) rotate(18)">
      <ellipse cx="0" cy="0" rx="3.8" ry="5.5"/>
      <path d="M-0.2 -5 C0.8 -2, -0.8 2, 0.2 5" stroke="#F8E5C8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Second '11' -->
    <!-- 1 -->
    <path d="M178 150 L190 145 L190 188 L198 188 L198 193 L178 193 L178 188 L186 188 L186 152 L178 156 Z"/>
    <!-- 1 -->
    <path d="M204 150 L216 145 L216 188 L224 188 L224 193 L204 193 L204 188 L212 188 L212 152 L204 156 Z"/>

    <!-- 'The Coffee Space' Serif Script Text -->
    <text x="160" y="222" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-weight="700" font-size="21.5" text-anchor="middle" letter-spacing="-0.2">The Coffee Space</text>
  </g>
</svg>
